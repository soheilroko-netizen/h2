<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dakal-tls — Settings</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="settings-window">
    <div id="app">
      <div class="settings-container">
        <div class="settings-header">
          <h1>Settings</h1>
          <p class="subtitle">Configure your VPN connection</p>
        </div>

        <!-- Tab Navigation -->
        <div class="tab-nav" role="tablist">
          <button class="tab-btn active" data-tab="app" role="tab" aria-selected="true">App Settings</button>
          <button class="tab-btn" data-tab="profile" role="tab" aria-selected="false">Profile</button>
          <button class="tab-btn" data-tab="split" role="tab" aria-selected="false">Split Tunneling</button>
        </div>

        <!-- Tab: App Settings -->
        <div role="tabpanel" class="tab-panel active" id="tab-app">
          <div class="form-group">
            <label>Theme</label>
            <select id="app-theme">
              <option value="dark" selected>Dark</option>
              <option value="light">Light</option>
              <option value="system">System</option>
            </select>
          </div>
          <div class="form-group">
            <label>Language</label>
            <select id="app-language">
              <option value="en" selected>English</option>
              <option value="fa">فارسی</option>
            </select>
          </div>
          <div class="form-group">
            <label>Startup</label>
            <select id="app-startup">
              <option value="none" selected>Do nothing</option>
              <option value="last">Load last profile</option>
              <option value="profile1">Profile 1</option>
            </select>
          </div>
          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" id="app-start-minimized" />
              <span>Start minimized</span>
            </label>
          </div>
          <div class="settings-controls">
            <button id="btn-save-app" class="btn btn-primary">Save</button>
          </div>
          <div id="app-message" class="message"></div>
        </div>

        <!-- Tab: Profile -->
        <div role="tabpanel" class="tab-panel" id="tab-profile" hidden>
          <div class="profile-bar">
            <label>Profile:</label>
            <select id="settings-profile-select">
              <option value="Default">Default</option>
            </select>
            <button id="btn-new-profile" title="New">+</button>
            <button id="btn-delete-profile" title="Delete">−</button>
          </div>
          <div class="form-group">
            <label>ShadowTLS Server IP:Port</label>
            <input type="text" id="cfg-server" placeholder="1.2.3.4:443" />
          </div>
          <div class="form-group">
            <label>ShadowTLS Password</label>
            <input type="text" id="cfg-password" placeholder="password" />
          </div>
          <div class="form-group">
            <label>ShadowTLS Version</label>
            <select id="cfg-version">
              <option value="0">Version 0</option>
              <option value="1" selected>Version 1</option>
              <option value="2">Version 2</option>
              <option value="3">Version 3</option>
            </select>
          </div>
          <div class="form-group">
            <label>Shadowsocks Server IP:Port</label>
            <input type="text" id="cfg-ss-server" placeholder="5.6.7.8:8388" />
          </div>
          <div class="form-group">
            <label>Shadowsocks Password</label>
            <input type="text" id="cfg-ss-password" placeholder="password" />
          </div>
          <div class="form-group">
            <label>Shadowsocks Method</label>
            <select id="cfg-ss-method">
              <option value="2022-blake3-aes-128-gcm" selected>2022-blake3-aes-128-gcm</option>
              <option value="2022-blake3-aes-256-gcm">2022-blake3-aes-256-gcm</option>
              <option value="2022-blake3-chacha20-poly1305">2022-blake3-chacha20-poly1305</option>
              <option value="aes-128-gcm">aes-128-gcm</option>
              <option value="aes-256-gcm">aes-256-gcm</option>
              <option value="chacha20-ietf-poly1305">chacha20-ietf-poly1305</option>
              <option value="xchacha20-ietf-poly1305">xchacha20-ietf-poly1305</option>
            </select>
          </div>
          <div class="settings-controls">
            <button id="btn-save-profile" class="btn btn-primary">Save</button>
            <button id="btn-switch-profile" class="btn btn-secondary">Switch</button>
          </div>
          <div id="profile-message" class="message"></div>
        </div>

        <!-- Tab: Split Tunneling -->
        <div role="tabpanel" class="tab-panel" id="tab-split" hidden>
          <div class="form-group">
            <label>Domain Rules (one per line)</label>
            <textarea id="cfg-split-domains" rows="6" placeholder="google.com&#10;github.com&#10;*.cloudflare.com"></textarea>
          </div>
          <div class="settings-controls">
            <button id="btn-save-split" class="btn btn-primary">Save</button>
          </div>
          <div id="split-message" class="message"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
