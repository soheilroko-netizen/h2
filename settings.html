<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings - dakal-tls</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="settings-window">
    <div id="app">
      <div class="container" style="overflow-y:auto; max-height:90vh;">
        <h1>Settings</h1>
        <p class="subtitle">Profile configuration</p>

        <div class="form-group">
          <label>Server Address (IP or domain)</label>
          <input type="text" id="cfg-server-address" placeholder="ns.baft.uk" />
        </div>
        <div class="form-group">
          <label>ShadowTLS Port</label>
          <input type="number" id="cfg-stls-port" placeholder="8553" />
        </div>
        <div class="form-group">
          <label>ShadowTLS Password</label>
          <input type="text" id="cfg-stls-password" placeholder="password" />
        </div>
        <div class="form-group">
          <label>ShadowTLS SNI</label>
          <input type="text" id="cfg-stls-sni" placeholder="dl.google.com" />
        </div>
        <div class="form-group">
          <label>Shadowsocks Port</label>
          <input type="number" id="cfg-ss-port" placeholder="8380" />
        </div>
        <div class="form-group">
          <label>Shadowsocks Password</label>
          <input type="text" id="cfg-ss-password" placeholder="password" />
        </div>
        <div class="form-group">
          <label>Socks5 Port</label>
          <input type="number" id="cfg-socks5-port" placeholder="1080" />
        </div>

        <hr style="margin: 16px 0; border-color: var(--border);" />
        <h3 style="margin-bottom: 12px; color: var(--accent);">Hysteria2</h3>

        <div class="form-group">
          <label>Hysteria2 Port</label>
          <input type="number" id="cfg-h2-port" placeholder="40001" />
        </div>

        <div class="form-group">
          <label>Hysteria2 Password</label>
          <input type="text" id="cfg-h2-password" placeholder="testpass1" />
        </div>

        <div class="form-group">
          <label>Hysteria2 SNI</label>
          <input type="text" id="cfg-h2-sni" placeholder="ns.baft.uk" />
        </div>

        <div class="form-group">
          <label>
            <input type="checkbox" id="cfg-h2-insecure" /> Insecure (skip cert verify)
          </label>
        </div>

        <div class="form-group">
          <label>Hysteria2 Obfs (salamander/none)</label>
          <input type="text" id="cfg-h2-obfs" placeholder="salamander" />
        </div>

        <div class="form-group">
          <label>Hysteria2 Obfs Password</label>
          <input type="text" id="cfg-h2-obfs-password" placeholder="testobfspass" />
        </div>

        <div class="form-group">
          <label>Hysteria2 Multiport Range</label>
          <input type="text" id="cfg-h2-mport" placeholder="40001-45000" />
        </div>

        <div class="form-group">
          <label>Domain Rules (one per line)</label>
          <textarea id="cfg-split-domains" rows="4" placeholder="google.com&#10;github.com"></textarea>
        </div>

        <div class="controls">
          <button id="btn-save-config" class="btn btn-primary">Save</button>
          <button id="btn-close-settings" class="btn btn-secondary">Close</button>
        </div>
        <div id="settings-message" class="message"></div>
      </div>
    </div>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
