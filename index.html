<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dakal-tls v5</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="main-window">
    <div id="app">
      <!-- ═══ Main View ═══ -->
      <div class="container" id="main-view">
        <h1>shado v5</h1>
        <p class="subtitle">ShadowTLS + Shadowsocks VPN</p>

        <div class="mode-toggle" id="mode-toggle">
          <button class="mode-btn active" data-mode="shadowtls" id="mode-stls">ShadowTLS</button>
          <button class="mode-btn" data-mode="hysteria2" id="mode-h2">Hysteria2</button>
        </div>

        <div class="profile-bar-main">
          <button id="btn-main-settings" class="btn-small">Settings</button>
          <button id="btn-main-log" class="btn-small">Log</button>
        </div>

        <div id="h2-preset-selector" style="display:none;margin:6px 0;padding:8px;background:#1a1a2e;border-radius:6px;border:1px solid #333;">
          <div style="display:flex;align-items:center;gap:8px;">
            <label style="color:#888;font-size:11px;">H2 Preset:</label>
            <select id="h2-preset-dropdown" style="flex:1;padding:4px 8px;background:#0f0f1e;color:#fff;border:1px solid #444;border-radius:4px;font-size:11px;">
              <option value="adsl">ADSL (↑4 / ↓16 Mbps)</option>
              <option value="4g">4G (↑15 / ↓30 Mbps)</option>
              <option value="5g" selected>5G/Fiber (↑40 / ↓80 Mbps)</option>
              <option value="max">Max (↑80 / ↓120 Mbps)</option>
            </select>
          </div>
        </div>

        <div class="status-card">
          <div class="status-indicator" id="status-dot"></div>
          <span id="status-text">Disconnected</span>
          <span class="status-address" id="status-address"></span>
        </div>

        <div class="server-info">
          <div class="info-row">
            <span class="label">Ping:</span>
            <span class="value" id="ping-value">-</span>
          </div>
          <div class="info-row">
            <span class="label">Uptime:</span>
            <span class="value" id="uptime-value">-</span>
          </div>
          <div class="info-row">
            <span class="label">Current:</span>
            <span class="value" id="traffic-value">↑ 0 B/s  ↓ 0 B/s</span>
          </div>
          <div class="info-row">
            <span class="label">Total:</span>
            <span class="value" id="total-traffic-value">↑ 0 B  ↓ 0 B</span>
          </div>
        </div>

        <div class="controls">
          <button id="btn-start" class="btn btn-primary">Start</button>
          <button id="btn-stop" class="btn btn-secondary" disabled>Stop</button>
        </div>

        <div id="message" class="message"></div>
      </div>

      <!-- ═══ Log View ═══ -->
      <div class="container" id="log-view" style="display:none">
        <h1>Connection Log</h1>
        <p class="subtitle">sing-box runtime logs</p>
        <div class="controls">
          <button id="btn-refresh-log" class="btn btn-secondary">Refresh</button>
          <button id="btn-back-from-log" class="btn btn-secondary">Back</button>
        </div>
        <pre id="log-content" class="log-content"></pre>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
