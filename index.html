<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dakal-tls v5</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- Main View -->
      <div id="main-view" class="container">
        <h1>shado v5</h1>
        <p class="subtitle">ShadowTLS + Shadowsocks VPN</p>

        <!-- Profile selector -->
        <div class="profile-bar-main">
          <select id="main-profile-select" class="profile-select">
            <option value="Default">Default</option>
          </select>
          <button id="btn-main-settings" class="btn-small">Settings</button>
          <button id="btn-main-log" class="btn-small">Log</button>
        </div>

        <div class="status-card">
          <div class="status-indicator" id="status-dot"></div>
          <span id="status-text">Disconnected</span>
        </div>

        <div class="server-info">
          <div class="info-row">
            <span class="label">Server:</span>
            <span class="value" id="server-value">-</span>
          </div>
          <div class="info-row">
            <span class="label">Ping:</span>
            <span class="value" id="ping-value">-</span>
          </div>
          <div class="info-row">
            <span class="label">Uptime:</span>
            <span class="value" id="uptime-value">-</span>
          </div>
          <div class="info-row">
            <span class="label">Traffic:</span>
            <span class="value" id="traffic-value">↑ 0 B/s  ↓ 0 B/s</span>
          </div>
          <div class="info-row">
            <span class="label">Total:</span>
            <span class="value" id="total-traffic-value">↑ 0 B  ↓ 0 B</span>
          </div>
        </div>

        <div class="controls">
          <button id="btn-start" class="btn btn-primary">Start</button>
          <button id="btn-stop" class="btn btn-secondary" disabled>Stop</button>
        </div>

        <div id="message" class="message"></div>
      </div>

      <!-- Log Viewer View -->
      <div id="log-view" class="container" style="display: none">
        <h1>Connection Log</h1>
        <p class="subtitle">sing-box runtime logs</p>
        <div class="controls">
          <button type="button" id="btn-refresh-log" class="btn btn-secondary">Refresh</button>
          <button type="button" id="btn-back-from-log" class="btn btn-secondary">Back</button>
        </div>
        <pre id="log-content" style="background: #1a1a1a; color: #0f0; padding: 12px; border-radius: 6px; max-height: 400px; overflow-y: auto; font-size: 12px; white-space: pre-wrap; word-break: break-all"></pre>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
