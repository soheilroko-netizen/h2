<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dakal-tls v5</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="main-window">
    <div id="app">
      <!-- ═══ Main View ═══ -->
      <div class="container" id="main-view">
        <h1>shado v5</h1>
        <p class="subtitle">ShadowTLS + Shadowsocks VPN</p>

        <div class="profile-bar-main">
          <select id="main-profile-select" class="profile-select"></select>
          <button id="btn-main-settings" class="btn-small">Settings</button>
          <button id="btn-main-log" class="btn-small">Log</button>
        </div>

        <div class="mode-toggle" id="mode-toggle">
          <button class="mode-btn active" data-mode="shadowtls" id="mode-stls">ShadowTLS</button>
          <button class="mode-btn" data-mode="hysteria2" id="mode-h2">Hysteria2</button>
        </div>

        <div class="status-card">
          <div class="status-indicator" id="status-dot"></div>
          <span id="status-text">Disconnected</span>
          <span class="status-address" id="status-address"></span>
        </div>

        <div class="server-info">
          <div class="info-row">
            <span class="label">Ping:</span>
            <span class="value" id="ping-value">-</span>
          </div>
          <div class="info-row">
            <span class="label">Uptime:</span>
            <span class="value" id="uptime-value">-</span>
          </div>
          <div class="info-row">
            <span class="label">Current:</span>
            <span class="value" id="traffic-value">↑ 0 B/s  ↓ 0 B/s</span>
          </div>
          <div class="info-row">
            <span class="label">Total:</span>
            <span class="value" id="total-traffic-value">↑ 0 B  ↓ 0 B</span>
          </div>
        </div>

        <div class="controls">
          <button id="btn-start" class="btn btn-primary">Start</button>
          <button id="btn-stop" class="btn btn-secondary" disabled>Stop</button>
        </div>

        <div id="message" class="message"></div>
      </div>

      <!-- ═══ Settings View ═══ -->
      <div class="container" id="settings-view" style="display:none; overflow-y:auto; max-height:90vh;">
        <h1>Settings</h1>
        <p class="subtitle">Profile configuration</p>

        <div class="form-group">
          <label>Server Address (IP or domain)</label>
          <input type="text" id="cfg-server-address" placeholder="ns.baft.uk" />
        </div>
        <div class="form-group">
          <label>ShadowTLS Port</label>
          <input type="number" id="cfg-stls-port" placeholder="8553" />
        </div>
        <div class="form-group">
          <label>ShadowTLS Password</label>
          <input type="text" id="cfg-stls-password" placeholder="password" />
        </div>
        <div class="form-group">
          <label>ShadowTLS SNI</label>
          <input type="text" id="cfg-stls-sni" placeholder="dl.google.com" />
        </div>
        <div class="form-group">
          <label>Shadowsocks Port</label>
          <input type="number" id="cfg-ss-port" placeholder="8380" />
        </div>
        <div class="form-group">
          <label>Shadowsocks Password</label>
          <input type="text" id="cfg-ss-password" placeholder="password" />
        </div>
        <div class="form-group">
          <label>Socks5 Port</label>
          <input type="number" id="cfg-socks5-port" placeholder="1080" />
        </div>

        <hr style="margin: 16px 0; border-color: var(--border);" />
        <h3 style="margin-bottom: 12px; color: var(--accent);">Hysteria2</h3>

        <div class="form-group">
          <label>
            <input type="checkbox" id="cfg-h2-enabled" /> Enable Hysteria2
          </label>
        </div>

        <div class="form-group">
          <label>Hysteria2 Port</label>
          <input type="number" id="cfg-h2-port" placeholder="40001" />
        </div>

        <div class="form-group">
          <label>Hysteria2 Password</label>
          <input type="text" id="cfg-h2-password" placeholder="testpass1" />
        </div>

        <div class="form-group">
          <label>Hysteria2 SNI</label>
          <input type="text" id="cfg-h2-sni" placeholder="ns.baft.uk" />
        </div>

        <div class="form-group">
          <label>
            <input type="checkbox" id="cfg-h2-insecure" /> Insecure (skip cert verify)
          </label>
        </div>

        <div class="form-group">
          <label>Hysteria2 Obfs (salamander/none)</label>
          <input type="text" id="cfg-h2-obfs" placeholder="salamander" />
        </div>

        <div class="form-group">
          <label>Hysteria2 Obfs Password</label>
          <input type="text" id="cfg-h2-obfs-password" placeholder="testobfspass" />
        </div>

        <div class="form-group">
          <label>Hysteria2 Multiport Range</label>
          <input type="text" id="cfg-h2-mport" placeholder="40001-45000" />
        </div>

        <div class="form-group">
          <label>Domain Rules (one per line)</label>
          <textarea id="cfg-split-domains" rows="4" placeholder="google.com&#10;github.com"></textarea>
        </div>

        <div class="controls">
          <button id="btn-save-config" class="btn btn-primary">Save</button>
          <button id="btn-back-from-settings" class="btn btn-secondary">Back</button>
        </div>
        <div id="settings-message" class="message"></div>
      </div>

      <!-- ═══ Log View ═══ -->
      <div class="container" id="log-view" style="display:none">
        <h1>Connection Log</h1>
        <p class="subtitle">sing-box runtime logs</p>
        <div class="controls">
          <button id="btn-refresh-log" class="btn btn-secondary">Refresh</button>
          <button id="btn-back-from-log" class="btn btn-secondary">Back</button>
        </div>
        <pre id="log-content" class="log-content"></pre>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
